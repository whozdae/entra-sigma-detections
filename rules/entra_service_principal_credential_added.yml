title: Credential Added To Entra ID Service Principal Or Application
id: bfe85524-2eb6-4d8a-81b9-db95d73e0ad5
status: experimental
description: |
    Detects a new client secret or certificate being added to a service principal or application
    registration in Microsoft Entra ID. Adding credentials to an existing application is a common
    persistence and privilege-escalation technique: an attacker who has compromised a privileged
    identity attaches their own secret to a highly privileged app or service principal, then
    authenticates as that application non-interactively, bypassing the original user's MFA and
    Conditional Access. This is the behaviour behind tooling such as AADInternals and is a frequent
    step in cloud identity intrusions.
references:
    - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
    - https://attack.mitre.org/techniques/T1098/001/
    - https://aadinternals.com/post/serviceprincipals/
author: Alex Adewoyin
date: 2026-10-14
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        Category: 'ApplicationManagement'
        OperationName:
            - 'Add service principal credentials'
            - 'Update application - Certificates and secrets management'
            - 'Update application – Certificates and secrets management'
    condition: selection
falsepositives:
    - Legitimate secret or certificate rotation performed by application owners or automated
      pipelines - correlate against your change-management process and known service accounts.
level: medium
